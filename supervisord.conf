[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:agy-daemon]
command=/bin/bash -c "echo 'AGY Container Daemon is running...' && tail -f /dev/null"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agy-daemon.log
stderr_logfile=/var/log/supervisor/agy-daemon.err.log

[program:hermes-webui]
command=python3 /workspace/webui/server.py
directory=/workspace/webui
environment=HERMES_WEBUI_HOST="0.0.0.0",HERMES_WEBUI_PORT="8989",HERMES_WEBUI_AGENT_DIR="/workspace/webui",HERMES_WEBUI_DEFAULT_MODEL="Antigravity 2.0 (agy CLI)",HERMES_WEBUI_DEFAULT_WORKSPACE="/workspace",HERMES_WORKSPACE_ROOT="/workspace",HERMES_WEBUI_SKIP_ONBOARDING="1",PYTHONPATH="/workspace/webui"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/hermes-webui.log
stderr_logfile=/var/log/supervisor/hermes-webui.err.log

